name: som_home

description: A modern Flutter web app for personal browser homepage
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  app_ui:
    path: packages/app_ui

  equatable: ^2.0.5
  file_selector: ^1.0.1

  flame_behaviors: ^1.0.0
  flame_tiled: ^1.15.0
  flow_builder: ^0.0.9
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^10.6.0
  bloc: ^8.1.2
  leap: ^0.2.1
  logging: ^1.2.0
  ordered_set: ^5.0.2
  path: ^1.8.3
  pathxp: ^0.4.0

  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  

  # UI & Theming
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # URL Handling
  url_launcher: ^6.2.3
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.3
  flutter_inappwebview: ^6.0.0
  
  # Game Engine
  flame: ^1.15.0  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  html: ^0.15.4
  file_picker: ^8.0.0+1
  web: ^1.1.1
  js_interop: ^0.0.1
  firebase_app_check: ^0.3.2+10
  logger: ^2.6.2
  webview_flutter_platform_interface: ^2.14.0
  chess: ^0.8.1
  audioplayers: ^6.5.1
  fl_chart: ^1.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: 
    generate: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
 

dependency_overrides:
  leap:
    git:
      url: https://github.com/VeryGoodOpenSource/leap.git
      ref: vgv
      path: packages/leap

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/expense_manger.html
    - assets/json_multi_corelator.html
    - assets/jsonCorelatorAnalyzer.html
    - assets/smartJsonFormatterAnalyzer.html
    - assets/sounds/
    - assets/images/
    - assets/map/
    - assets/map/anim/
    - assets/map/tiles/
    - assets/map/objects/
    - assets/music/
    - assets/sfx/
    - assets/icon.png
    # - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
